<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverage atlas — Hosts and host details</title>
  <style>:root {
  color-scheme: dark;
  --ink: #f3efe6;
  --muted: #b7aea0;
  --line: #3a342c;
  --paper: #141210;
  --card: #1e1b18;
  --wash: #2a2622;
  --link: #8ed4cc;
  --teal: #1c7f76;
  --teal-soft: #163330;
  --blue: #2f6494;
  --blue-soft: #1a2c3d;
  --plum: #6d4e8a;
  --plum-soft: #2a2233;
  --red: #a33d3d;
  --red-soft: #3a2222;
  --amber: #9a6818;
  --amber-soft: #332816;
  --stone: #8d877c;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
  font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { min-height: 100vh; }
button, input, a { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); }

.app { max-width: 1280px; margin: 0 auto; padding: 28px 28px 80px; }
.top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 18px; }
h1 { font-size: 40px; line-height: 1; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.03em; }
.lede { margin: 0; max-width: 68ch; color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
.stamp { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }

nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 22px; }
nav a, .chip, .seg-btn {
  font-family: "Segoe UI", system-ui, sans-serif;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  color: var(--ink);
}
nav a[aria-current="page"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.banner, .card, .shot-frame, .drawer, .test {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.banner { padding: 14px 16px; margin-bottom: 18px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
.grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; }
.card { padding: 16px 18px 18px; }
.card h2, .block h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
.sub { margin: 0 0 12px; color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45; }

.bar-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; margin: 8px 0; }
.bar-row span.lbl { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; }
.bar { display: flex; height: 28px; border-radius: 8px; overflow: hidden; background: var(--wash); }
.seg { display: flex; align-items: center; justify-content: center; color: white; font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; min-width: 8px; text-decoration: none; }
.seg.smoke, .kind-smoke { background: var(--teal); }
.seg.regression, .kind-regression { background: var(--blue); }
.seg.journey, .kind-journey { background: var(--plum); }
.seg.destructive, .kind-destructive { background: var(--red); }
.seg.written-not-run, .kind-written-not-run { background: var(--amber); }
.seg.covered { background: var(--teal); }
.seg.boundary { background: var(--amber); }
.seg.out-of-scope { background: var(--stone); }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.legend a { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

.risks { display: grid; gap: 10px; }
.risk { padding: 12px 14px; border-radius: 12px; background: var(--wash); border: 1px solid var(--line); }
.risk strong { display: block; margin-bottom: 4px; }
.risk p, .why, .checks, .action { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
.meta { margin-top: 6px; color: var(--muted); font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; }

.smoke-col { display: grid; gap: 8px; }
.smoke-item { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.smoke-item:last-child { border-bottom: 0; }
.kicker { font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

.screen-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.shot-frame { overflow: auto; max-height: 74vh; position: relative; }
.stage { position: relative; }
.stage img { display: block; width: 100%; height: auto; }
.hot {
  position: absolute;
  border: 2px solid var(--teal);
  background: rgba(28, 127, 118, 0.18);
  border-radius: 4px;
  padding: 0;
}
.hot.boundary { border-style: dashed; border-color: var(--amber); background: rgba(154, 104, 24, 0.2); }
.hot[aria-pressed="true"] { background: rgba(28, 127, 118, 0.32); outline: 2px solid var(--ink); z-index: 2; }
.hot.boundary[aria-pressed="true"] { background: rgba(154, 104, 24, 0.34); }
.hot .n {
  position: absolute; top: -1px; left: -1px;
  background: var(--ink); color: var(--paper);
  font-family: "Segoe UI", system-ui, sans-serif;
  font-size: 11px; line-height: 1; padding: 3px 5px; border-radius: 3px;
}
.missing-shot { padding: 28px; font-family: "Segoe UI", system-ui, sans-serif; color: var(--muted); }
.regions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.drawer { padding: 14px; position: sticky; top: 12px; max-height: 74vh; overflow: auto; }
.drawer h3 { margin: 14px 0 6px; font-size: 16px; }
.test { padding: 12px; margin: 0 0 10px; }
.test h3 { margin: 6px 0; font-size: 16px; letter-spacing: -0.01em; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge {
  font-family: "Segoe UI", system-ui, sans-serif;
  font-size: 11px; border-radius: 999px; padding: 2px 7px; color: white;
}
.badge.plain { background: var(--wash); color: var(--ink); }
dl { margin: 8px 0 0; }
dt { font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
dd { margin: 2px 0 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.45; }
.note { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters input {
  font-family: "Segoe UI", system-ui, sans-serif;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 12px; min-width: 240px;
}
.group { margin: 18px 0; }
.group h2 { font-size: 20px; }
.foot { margin-top: 16px; color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
.steps { display: grid; gap: 8px; margin-bottom: 12px; }
.step {
  text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px;
}
.step[aria-current="step"] { border-color: var(--ink); }
.step b { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

@media (max-width: 980px) {
  .grid-2, .screen-layout, .bar-row { grid-template-columns: 1fr; }
  .top { flex-direction: column; align-items: flex-start; }
  .stamp { text-align: left; white-space: normal; }
  h1 { font-size: 32px; }
}
</style>
</head>

  <script>(function () {
  const data = JSON.parse(document.getElementById('coverage-data').textContent);
  const tests = new Map(data.tests.map((test) => [test.id, test]));
  const screens = new Map(data.screens.map((screen) => [screen.id, screen]));
  const app = document.getElementById('app');
  let query = '';

  const kindClass = {
    smoke: 'kind-smoke',
    regression: 'kind-regression',
    journey: 'kind-journey',
    destructive: 'kind-destructive',
    'written-not-run': 'kind-written-not-run',
  };

  function esc(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function hashParts() {
    const raw = location.hash.replace(/^#/, '');
    const [view = 'overview', a = '', b = '', c = ''] = raw.split('/');
    return { view, a, b, c };
  }

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  function pageMatch(test, page) {
    if (page === 'all') return true;
    if (page === 'api') return test.layer === 'api';
    if (page === 'hosts') return test.area === 'hosts' || test.area === 'cross';
    if (page === 'host-details') return test.area === 'host-details' || test.area === 'cross';
    if (page === 'session') {
      return test.hotspotIds.some((id) => ['hs-login', 'hs-signout', 'hs-account-other', 'hs-signed-out'].includes(id));
    }
    return true;
  }

  function filtered(kind, page) {
    const q = query.trim().toLowerCase();
    return data.tests.filter((test) => {
      if (kind !== 'all' && test.kind !== kind) return false;
      if (!pageMatch(test, page)) return false;
      if (!q) return true;
      return `${test.title} ${test.why} ${test.actionOrCall} ${test.checks} ${test.describeTitle}`.toLowerCase().includes(q);
    });
  }

  function badge(kind, label) {
    return `<span class="badge ${kindClass[kind] || 'plain'}">${esc(label || kind)}</span>`;
  }

  function testCard(test) {
    const skips = test.skips.length ? `<p class="note">May skip on this preview: ${esc(test.skips.join('; '))}</p>` : '';
    const loop = test.loopNote ? `<p class="note">${esc(test.loopNote)}</p>` : '';
    const fileNote = test.fileNote && test.kind === 'written-not-run' ? `<p class="note">${esc(test.fileNote)}</p>` : '';
    const places = test.hotspotIds
      .map((id) => {
        const screen = data.screens.find((item) => item.hotspots.some((hot) => hot.id === id));
        const hot = screen && screen.hotspots.find((item) => item.id === id);
        if (!screen || !hot) return '';
        const view = screen.page === 'host-details' ? 'details' : screen.page === 'session' ? 'journeys' : 'hosts';
        const hash = view === 'journeys' ? `#journeys/online-host` : `#${view}/${screen.id}/${id}`;
        return `<a href="${hash}">${esc(hot.label)}</a>`;
      })
      .filter(Boolean);
    return `<article class="test">
      <div class="badges">${badge(test.kind, test.kind.replace(/-/g, ' '))}<span class="badge plain">${esc(test.tag)}</span><span class="badge plain">${esc(test.suite)}</span></div>
      <h3>${esc(test.title)}</h3>
      <dl>
        <dt>${esc(test.verb)}</dt><dd>${esc(test.actionOrCall)}</dd>
        <dt>Checks</dt><dd>${esc(test.checks)}</dd>
        <dt>Why</dt><dd>${esc(test.why)}</dd>
        <dt>Where it runs</dt><dd>${esc(test.runLabel)}</dd>
      </dl>
      ${skips}${loop}${fileNote}
      <p class="meta">${esc(test.file)}:${test.line}${places.length ? ' · ' + places.join(' · ') : ''}</p>
    </article>`;
  }

  function bar(segments) {
    const total = segments.reduce((sum, seg) => sum + seg.count, 0) || 1;
    return `<div class="bar">${segments
      .filter((seg) => seg.count > 0)
      .map((seg) => {
        const label = seg.count >= 8 ? String(seg.count) : '';
        return `<a class="seg ${esc(seg.className)}" style="flex:${seg.count}" href="${esc(seg.href)}" title="${esc(seg.title)}: ${seg.count}">${label}</a>`;
      })
      .join('')}</div>`;
  }

  function nav(current) {
    const items = [
      ['overview', 'Overview'],
      ['hosts', 'Hosts'],
      ['details', 'Host details'],
      ['journeys', 'Journeys'],
      ['api', 'API'],
      ['gaps', 'Not in this suite'],
      ['tests', 'All tests'],
    ];
    return `<nav>${items
      .map(([id, label]) => `<a href="#${id}" ${current === id ? 'aria-current="page"' : ''}>${label}</a>`)
      .join('')}</nav>`;
  }

  function shell(current, body) {
    const shot = data.shotsCapturedAt ? `Screens captured ${data.shotsCapturedAt.slice(0, 16).replace('T', ' ')}` : 'Screens not captured yet';
    return `<header class="top">
      <div>
        <h1>Coverage atlas</h1>
        <p class="lede">What the Hosts and host-details suite is built to cover, what kind of check each block is, and why it was written. Counts are tests, not tests times browsers.</p>
      </div>
      <p class="stamp">Generated ${esc(data.generatedAt.slice(0, 16).replace('T', ' '))}<br>${esc(shot)}</p>
    </header>
    <p class="banner">This page is the map of the specs. It is not the result of the last Playwright run. A green run does not mean pagination was tested, and a red run does not erase a case that is written here.</p>
    ${nav(current)}
    ${body}`;
  }

  function overview() {
    const kinds = data.kindCounts.map((item) => ({
      count: item.count,
      className: item.kind,
      href: `#tests/${item.kind}/all`,
      title: item.label,
    }));
    const legend = data.kindCounts
      .map((item) => `<a href="#tests/${item.kind}/all"><i class="sw ${kindClass[item.kind]}"></i>${esc(item.label)} ${item.count}</a>`)
      .join('');
    const controlRow = (page, label) => {
      const segs = ['covered', 'boundary', 'out-of-scope'].map((coverage) => {
        const found = data.controlCounts.find((row) => row.page === page && row.coverage === coverage);
        return {
          count: found ? found.count : 0,
          className: coverage,
          href: coverage === 'covered' ? `#${page === 'host-details' ? 'details' : page === 'session' ? 'journeys' : 'hosts'}` : '#gaps',
          title: `${label} ${coverage}`,
        };
      });
      return `<div class="bar-row"><span class="lbl">${label}</span>${bar(segs)}</div>`;
    };
    const risks = data.risks
      .map(
        (risk) => `<article class="risk">${badge(risk.kind, risk.kind.replace(/-/g, ' '))}<strong>${esc(risk.title)}</strong><p>${esc(risk.why)}</p><p class="meta">${esc(risk.file)}</p></article>`,
      )
      .join('');
    const smokeList = (layer) =>
      data.smoke
        .filter((item) => item.layer === layer)
        .map((item) => `<div class="smoke-item"><div class="kicker">${esc(item.file)}</div><strong>${esc(item.title)}</strong><p class="why">${esc(item.why)}</p></div>`)
        .join('');
    const skipText = data.skipNotes.length
      ? ` Some tests skip when this preview is not ready: ${data.skipNotes.map(esc).join(' · ')}`
      : '';
    return shell(
      'overview',
      `<section class="grid-2">
        <article class="card">
          <h2>Tests by kind</h2>
          <p class="sub">Smoke is the one happy path in an area. Regression is the rest of the read-only cases. The journey is one cross-page session. Destructive runs once, in Chrome, after the read-only browsers. Written-not-run is specified and intentionally not executed.</p>
          ${bar(kinds)}
          <div class="legend">${legend}</div>
          <h2 style="margin-top:22px">Controls, not test count</h2>
          <p class="sub">Search has many cases and still counts as one control. Covered, held at the boundary, or left out of the suite.</p>
          ${controlRow('hosts', 'Hosts')}
          ${controlRow('host-details', 'Host details')}
          ${controlRow('session', 'Session')}
          <div class="legend"><span><i class="sw seg covered"></i>Covered</span><span><i class="sw seg boundary"></i>Boundary</span><span><i class="sw seg out-of-scope"></i>Out of scope</span></div>
        </article>
        <article class="card">
          <h2>Why this set exists</h2>
          <p class="sub">Four smoke paths, plus the delete that a smoke test must not perform.</p>
          <div class="risks">${risks}</div>
        </article>
      </section>
      <section class="grid-2" style="margin-top:16px">
        <article class="card"><h2>Every UI smoke test</h2><div class="smoke-col">${smokeList('ui')}</div></article>
        <article class="card"><h2>Every API smoke test</h2><div class="smoke-col">${smokeList('api')}</div></article>
      </section>
      <p class="foot">Read-only UI runs in Chrome, Firefox, and Safari and is counted once. The API suite uses no browser. The host delete is Chrome only.${skipText}</p>`,
    );
  }

  function screenView(page, current) {
    const list = data.screens.filter((screen) => screen.page === page);
    const hash = hashParts();
    const screen = screens.get(hash.a) || list[0];
    const selected = hash.b || '';
    const chips = list
      .map((item) => `<a class="chip" href="#${current}/${item.id}" ${item.id === screen.id ? 'aria-pressed="true"' : ''}>${esc(item.title)}</a>`)
      .join('');
    const boxes = screen.hotspots
      .map((hot, index) => {
        if (!hot.box) return '';
        return `<button class="hot ${hot.coverage}" style="left:${hot.box.x}%;top:${hot.box.y}%;width:${Math.max(hot.box.w, 1.2)}%;height:${Math.max(hot.box.h, 1.2)}%" aria-pressed="${hot.id === selected}" data-hot="${esc(hot.id)}" title="${esc(hot.label)}"><span class="n">${index + 1}</span></button>`;
      })
      .join('');
    const picture = screen.image
      ? `<div class="shot-frame"><div class="stage"><img alt="${esc(screen.title)} on Fleet preview" src="${esc(screen.image)}">${boxes}</div></div>`
      : `<div class="shot-frame missing-shot">No screenshot yet. Run <code>npm run coverage:shots</code> while <code>fleetctl preview</code> is up. The regions below still list the tests.</div>`;
    const regions = screen.hotspots
      .map((hot, index) => {
        const where = hot.box ? '' : ' · not in this capture';
        return `<a class="chip" href="#${current}/${screen.id}/${hot.id}" ${hot.id === selected ? 'aria-pressed="true"' : ''}>${index + 1}. ${esc(hot.label)}${hot.coverage === 'boundary' ? ' · boundary' : ''}${where}</a>`;
      })
      .join('');
    const hot = screen.hotspots.find((item) => item.id === selected);
    const drawer = hot
      ? `<h2>${esc(hot.label)}</h2><p class="sub">${hot.coverage === 'boundary' ? 'This control is on screen. The test checks it and does not follow it.' : 'Tests that land on this region.'}</p>${hot.testIds.map((id) => testCard(tests.get(id))).join('')}`
      : `<h2>${esc(screen.title)}</h2><p class="sub">${esc(screen.blurb)}</p><p class="note">${esc(screen.route)}</p><p class="note">Select a numbered region to read the Action, Checks, and Why.</p>`;
    return shell(
      current,
      `<div class="chips">${chips}</div>
      <div class="screen-layout">
        <div>
          ${picture}
          <div class="regions">${regions}</div>
          <p class="sub" style="margin-top:8px">${esc(screen.blurb)} <span class="meta">${esc(screen.route)}</span></p>
        </div>
        <aside class="drawer">${drawer}</aside>
      </div>`,
    );
  }

  function journeys() {
    const hash = hashParts();
    const journey = data.journeys.find((item) => item.id === hash.a) || data.journeys[0];
    const step = journey.steps.find((item) => String(item.n) === hash.b) || journey.steps[0];
    const screen = screens.get(step.screenId);
    const cards = data.journeys
      .map((item) => `<a class="chip" href="#journeys/${item.id}" ${item.id === journey.id ? 'aria-pressed="true"' : ''}>${esc(item.title)}</a>`)
      .join('');
    const steps = journey.steps
      .map(
        (item) => `<a class="step" href="#journeys/${journey.id}/${item.n}" ${item.n === step.n ? 'aria-current="step"' : ''}><b>Step ${item.n}</b><br>${esc(item.text)}</a>`,
      )
      .join('');
    const hot = screen.hotspots.find((item) => item.id === step.hotspotId);
    const boxes = screen.hotspots
      .filter((item) => item.box && item.id === step.hotspotId)
      .map(
        (item) =>
          `<span class="hot ${item.coverage}" style="left:${item.box.x}%;top:${item.box.y}%;width:${Math.max(item.box.w, 1.2)}%;height:${Math.max(item.box.h, 1.2)}%;pointer-events:none" aria-hidden="true"><span class="n">${step.n}</span></span>`,
      )
      .join('');
    const picture = screen.image
      ? `<div class="shot-frame"><div class="stage"><img alt="${esc(screen.title)}" src="${esc(screen.image)}">${boxes}</div></div>`
      : `<div class="shot-frame missing-shot">Screenshot not captured for ${esc(screen.title)}.</div>`;
    return shell(
      'journeys',
      `<div class="chips">${cards}</div>
      <div class="screen-layout">
        <div>
          <div class="steps">${steps}</div>
          ${picture}
          <p class="sub">${esc(screen.blurb)}</p>
        </div>
        <aside class="drawer">
          <h2>Step ${step.n}</h2>
          <p class="sub">${esc(step.text)}</p>
          ${hot ? `<p class="note">Region: ${esc(hot.label)}</p>` : ''}
          ${testCard(tests.get(journey.testId))}
        </aside>
      </div>`,
    );
  }

  function api() {
    const body = data.apiGroups
      .map((group) => {
        const note = group.fileNote ? `<p class="note">${esc(group.fileNote)}</p>` : '';
        return `<section class="group"><h2>${esc(group.title)}</h2><p class="sub">${esc(group.why)}</p><p class="meta">${esc(group.file)}</p>${note}${group.testIds
          .map((id) => testCard(tests.get(id)))
          .join('')}</section>`;
      })
      .join('');
    return shell('api', body);
  }

  function gaps() {
    const block = (coverage, title, copy) => {
      const rows = data.controls
        .filter((control) => control.coverage === coverage)
        .map(
          (control) =>
            `<article class="test"><div class="badges"><span class="badge ${coverage === 'boundary' ? 'kind-written-not-run' : 'plain'}">${esc(control.page)}</span></div><h3>${esc(control.label)}</h3><p class="why">${esc(control.summary)}</p></article>`,
        )
        .join('');
      return `<article class="card"><h2>${title}</h2><p class="sub">${copy}</p>${rows}</article>`;
    };
    const written = data.tests.filter((test) => test.kind === 'written-not-run').map((test) => testCard(test)).join('');
    return shell(
      'gaps',
      `<div class="grid-2">
        ${block('boundary', 'On screen, not followed', 'The control is visible. A test names it and stops. That is not coverage of the next page.')}
        ${block('out-of-scope', 'Left out on purpose', 'Free preview cannot reach these, or following them leaves Hosts and host details. Pagination is the exception: the UI needs 50 hosts, and the API still checks the page params.')}
      </div>
      <section class="group"><h2>Written, not run</h2><p class="sub">Authenticated deletes are specified and marked test.describe.fixme. Fleet cannot restore that same host id.</p>${written}</section>`,
    );
  }

  function catalog() {
    const hash = hashParts();
    const kind = hash.a || 'all';
    const page = hash.b || 'all';
    const kinds = ['all', 'smoke', 'regression', 'journey', 'destructive', 'written-not-run'];
    const pages = [
      ['all', 'All pages'],
      ['hosts', 'Hosts'],
      ['host-details', 'Host details'],
      ['session', 'Session'],
      ['api', 'API layer'],
    ];
    const kindChips = kinds
      .map((item) => `<a class="chip" href="#tests/${item}/${page}" ${item === kind ? 'aria-pressed="true"' : ''}>${esc(item.replace(/-/g, ' '))}</a>`)
      .join('');
    const pageChips = pages
      .map(([id, label]) => `<a class="chip" href="#tests/${kind}/${id}" ${id === page ? 'aria-pressed="true"' : ''}>${esc(label)}</a>`)
      .join('');
    const rows = filtered(kind, page);
    const groups = [];
    for (const test of rows) {
      const key = `${test.file}::${test.describeTitle}`;
      const last = groups[groups.length - 1];
      if (!last || last.key !== key) groups.push({ key, title: test.describeTitle, file: test.file, tests: [test] });
      else last.tests.push(test);
    }
    return shell(
      'tests',
      `<div class="filters">
        <input id="q" type="search" placeholder="Filter by title, action, or why" value="${esc(query)}" aria-label="Filter tests">
        ${kindChips}${pageChips}
        <span class="note">${rows.length} tests</span>
      </div><div id="results">${catalogBody(rows)}</div>`,
    );
  }

  function render() {
    const { view } = hashParts();
    const current = ['overview', 'hosts', 'details', 'journeys', 'api', 'gaps', 'tests'].includes(view) ? view : 'overview';
    const html =
      current === 'hosts'
        ? screenView('hosts', 'hosts')
        : current === 'details'
          ? screenView('host-details', 'details')
          : current === 'journeys'
            ? journeys()
            : current === 'api'
              ? api()
              : current === 'gaps'
                ? gaps()
                : current === 'tests'
                  ? catalog()
                  : overview();
    app.innerHTML = html;
    const input = document.getElementById('q');
    if (input) {
      input.focus();
      input.setSelectionRange(query.length, query.length);
      input.addEventListener('input', () => {
        query = input.value;
        const { a, b } = hashParts();
        const rows = filtered(a || 'all', b || 'all');
        const hold = document.querySelector('.filters .note');
        if (hold) hold.textContent = `${rows.length} tests`;
        const results = document.getElementById('results');
        if (results) results.innerHTML = catalogBody(rows);
      });
    }
    const frame = app.querySelector('.hot[aria-pressed="true"]');
    if (frame) frame.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function catalogBody(rows) {
    if (!rows.length) return '<p class="banner">No tests match.</p>';
    const groups = [];
    for (const test of rows) {
      const key = `${test.file}::${test.describeTitle}`;
      const last = groups[groups.length - 1];
      if (!last || last.key !== key) groups.push({ key, title: test.describeTitle, file: test.file, tests: [test] });
      else last.tests.push(test);
    }
    return groups
      .map(
        (group) =>
          `<section class="group"><h2>${esc(group.title)}</h2><p class="meta">${esc(group.file)}</p>${group.tests.map((test) => testCard(test)).join('')}</section>`,
      )
      .join('');
  }

  window.addEventListener('hashchange', render);
  if (!location.hash) location.hash = '#overview';
  else render();
})();
</script>
</body>
</html>
