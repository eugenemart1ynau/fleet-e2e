name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLEET_EMAIL: admin@example.com
      FLEET_PASSWORD: ${{ secrets.FLEET_PASSWORD }}
      READINESS_TIMEOUT_MS: '360000'
      WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Install fleetctl
        run: |
          url=$(curl -fsSL https://api.github.com/repos/fleetdm/fleet/releases/latest \
            | jq -r '.assets[] | select(.name | test("^fleetctl_v[0-9].*_linux_amd64\\.tar\\.gz$")) | .browser_download_url')
          curl -fsSL "$url" -o /tmp/fleetctl.tar.gz
          mkdir -p /tmp/fleetctl-extract
          tar -xzf /tmp/fleetctl.tar.gz -C /tmp/fleetctl-extract
          bin=$(find /tmp/fleetctl-extract -type f -name fleetctl | head -n 1)
          sudo install -m 755 "$bin" /usr/local/bin/fleetctl
          fleetctl --version

      - name: Start Fleet preview
        run: |
          # setsid keeps preview alive after this step. The runner would otherwise stop it.
          setsid fleetctl preview --disable-open-browser > preview.log 2>&1 < /dev/null &
          echo $! > preview.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1337/healthz >/dev/null; then
              echo "Fleet healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Fleet did not become healthy within 10 minutes"
          tail -n 100 preview.log || true
          exit 1

      - name: API
        id: api
        run: npm run test:api
      - name: Upload API results
        if: steps.api.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: results-api
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            preview.log

      - name: Smoke
        id: smoke
        run: npm run test:ui:smoke
      - name: Upload smoke results
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: results-smoke
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            preview.log

      - name: Regression
        id: regression
        run: npm run test:ui:regression
      - name: Upload regression results
        if: steps.regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: results-regression
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            preview.log

      - name: E2E
        id: e2e
        run: npm run test:ui:e2e
      - name: Upload E2E results
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: results-e2e
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            preview.log

      - name: Delete
        id: delete
        run: |
          sh scripts/playwright.sh --project=destructive --no-deps
          npm run test:api:destructive
      - name: Upload delete results
        if: steps.delete.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: results-delete
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            preview.log

      - name: Stop Fleet preview
        if: always()
        run: |
          if command -v fleetctl >/dev/null; then fleetctl preview stop || true; fi
          if [ -f preview.pid ]; then kill "$(cat preview.pid)" 2>/dev/null || true; fi
